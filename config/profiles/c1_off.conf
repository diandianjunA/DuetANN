# DuetANN c1_off：完整原生运行时配置示例；所有显式参数均可修改。

[profile]
# 系统预设：baseline、full 或 custom；只提供默认值。
profile = full

# C1 更新优化：auto 跟随 profile，on/off 可独立覆盖。
c1 = off

# C2 图传输优化：auto 跟随 profile，on/off 可独立覆盖。
c2 = on

# C3 GPU 查询优化：auto 跟随 profile，on/off 可独立覆盖。
c3 = on

# 当前节点段选择器，例如 compute:0 或 storage:0。
node = compute:0

[compute:0]
# 当前节点在集群中的主机名或 IP 地址。
host = 192.168.6.125

# 索引元数据、模型和分片共享的路径前缀。
index-prefix = /data/xjs/duetann_sift100m/index/sift100m_R96_bw128_metis_pmd32_pq32_schema16

# 当前节点用于 QP 建链的 TCP 端口。
port = 2234

# 当前计算节点使用的 CUDA 设备序号。
gpu-device = 0

# 当前计算节点是否负责发起集群同步。
initiator = true

# 是否作为存储服务运行；计算节点为 false。
is-server = false

# 每台存储节点接受的计算节点数量。
num-clients = 1

# 是否禁用 CPU 线程绑核；默认 false。
disable-thread-pinning = false

[storage:0]
# 当前节点在集群中的主机名或 IP 地址。
host = 192.168.6.202

# 索引元数据、模型和分片共享的路径前缀。
index-prefix = /data/xjs/duetann_sift100m/index/sift100m_R96_bw128_metis_pmd32_pq32_schema16

# 存储节点加载的本地图分片；计算节点可留空。
server-index-file = /data/xjs/duetann_sift100m/index/sift100m_R96_bw128_metis_pmd32_pq32_schema16_node1_of4.dat


# 当前存储节点的从零开始分片编号。
storage-id = 3

# 是否作为存储服务运行；计算节点为 false。
is-server = true

# 当前计算节点是否负责发起集群同步。
initiator = false

# 每台存储节点接受的计算节点数量。
num-clients = 1

# 是否禁用 CPU 线程绑核；默认 false。
disable-thread-pinning = false

[index]
# 索引元数据、模型和分片共享的路径前缀。
index-prefix = /data/xjs/duetann_sift100m/index/sift100m_R96_bw128_metis_pmd32_pq32_schema16

# 存储节点加载的本地图分片；计算节点可留空。
server-index-file = 

[search]
# 本进程用于控制和更新的 CPU 线程数。
threads = 64

# 实验和采样的确定性随机种子。
seed = 1234

# 向量维度，必须与索引元数据一致。
dim = 128

# 索引包含的不可变基础向量数量。
max-vectors = 100000000

# 基础和动态向量 ID 的排他上界。
vector-id-namespace-size = 4294967295

# 每次查询返回的最近邻数量。
k = 10

# 图节点的最大出度，必须与索引一致。
R = 96

# 存储侧在线图维护使用的搜索 Beam 宽度。
beam-width-construction = 128

# RobustPrune 多样性参数，必须有限且不小于 1。
alpha = 1.2

# 向量存储类型：auto、float32、uint8 或 int8。
vector-data-type = uint8

# 每台存储节点注册的内存容量，单位 GiB。
mn-memory = 30

[transport]
# QP 建链握手超时，单位毫秒。
qp-handshake-timeout-ms = 10000

# RDMA 设备名；留空表示自动选择。
ib-device = mlx5_0

# RDMA 设备端口号。
ib-port = 1

# 一次 CQ 轮询最多读取的完成项数量。
max-poll-cqes = 64

# 发送队列允许的最大未完成工作请求数。
max-send-wrs = 4096

# 接收队列允许的最大未完成工作请求数。
max-receive-wrs = 4096

[gpu]
# 当前计算节点使用的 CUDA 设备序号。
gpu-device = 0

# 是否采集细粒度分解统计；正式性能测试通常关闭。
enable-breakdown = false

# GPU 同时驻留的最大查询数量。
gpu-query-slots = 256

# 查询引擎显式 GPU 分配的硬上限，单位 GiB。
gpu-memory-limit-gb = 32

# 为 CUDA 和传输运行时预留的显存，单位 GiB。
gpu-memory-reserve-gb = 4

# 启动时单次 PQ 预取窗口大小，单位 MiB。
gpu-bootstrap-window-mb = 64

# 启动阶段并行 PQ 预取窗口数量。
gpu-bootstrap-windows = 4

# GPU 图遍历 Beam 宽度，直接影响搜索工作量。
gpu-traversal-beam-width = 96

# 最终精确向量重排宽度，至少为 k。
gpu-final-rerank-width = 128

# 每次查询允许的最大图扩展次数。
gpu-max-expansions = 96

# 用于查询入口的最近中心分片数量。
gpu-centroid-route-fanout = 1

# 每台存储节点对应的 GPU 发起 RDMA QP 数量。
gpu-rdma-qps = 32

# GPU 发起 RDMA 完成的故障停止超时，单位毫秒。
gpu-direct-timeout-ms = 250

# 每个 SM 允许的常驻 CTA 上限，实际值受硬件约束。
gpu-persistent-blocks-per-sm = 4

# Persistent 内核每线程设备栈下限，单位字节。
gpu-device-stack-bytes = 4096

# RDMA 跟踪模式：off、sampled 或 full。
query-rdma-trace-mode = off

# sampled 模式下每隔多少个请求采样一次。
query-rdma-trace-sample-rate = 1000

# RDMA 跟踪 JSONL 输出路径；关闭跟踪时留空。
query-rdma-trace-output = 

# 每个查询槽预分配的跟踪事件容量。
query-rdma-trace-events-per-query = 1024

[C1:update]
# 是否启用计算侧 insert、upsert 和 erase 提交。
enable-updates = true

# 更新协议：coupled、decoupled 或 manual。
storage-owner-update-completion-mode = coupled

# 一次存储 RPC 携带的最大更新数量。
storage-owner-batch-max = 32

# 前台更新形成微批的最大等待微秒数；0 立即发送。
storage-owner-batch-max-wait-us = 0

# 后台 Stage2 部分批次的最大合并等待微秒数。
storage-owner-stage2-batch-max-wait-us = 0

# Stage2 描述符准入前的诊断延迟；生产通常为 0。
storage-owner-stage2-initial-delay-ms = 0

# 是否在物理 home 合并执行远端 Stage2 候选评分。
storage-owner-stage2-score-many = false

# 启用 score-many RPC 的最小待评分候选数。
storage-owner-stage2-score-many-min-items = 128

# 是否合并兼容的 Stage2 home RPC。
storage-owner-stage2-home-rpc-combining = false

# 是否分离 Stage2 评分与图维护 RPC 平面。
storage-owner-stage2-split-plane = false

# 是否启用证书租约合并的图维护协议。
storage-owner-lease-merge = false

# Stage2 有序图请求的最大发起宽度。
storage-owner-stage2-graph-issue-width = 1

# 每对存储节点之间的 RC QP 数量。
storage-owner-peer-qps-per-peer = 8

# 每个存储数据 QP 允许的未完成读取数。
storage-owner-peer-rdma-tokens = 16

# 每台存储节点允许的进行中更新批次数。
storage-owner-rpc-depth = 16

# 更新 RPC 超时，单位毫秒。
storage-owner-rpc-timeout-ms = 600000

# 同步精确更新的最大重试次数；0 表示不限。
storage-owner-exact-max-attempts = 0

# 更新搜索期间并发读取的节点快照数。
storage-owner-search-snapshot-batch = 256

# 后台 Stage2 维护执行器数量。
storage-owner-maintenance-workers = 8

# 有界维护队列容量；写侧在满时承受反压。
storage-owner-maintenance-queue-depth = 65536

# Stage2 永久失败的最大重试窗口；0 表示不限。
storage-owner-stage2-max-retry-ms = 300000

# Stage2 搜索预算开始收缩的 backlog 低水位。
storage-owner-stage2-budget-backlog-low = 0

# Stage2 使用最紧搜索预算的 backlog 高水位。
storage-owner-stage2-budget-backlog-high = 0

# 高水位下的 Stage2 扩展预算；0 表示不限。
storage-owner-stage2-budget-max-expansions = 0

# 高水位下的候选访问预算；0 表示不限。
storage-owner-stage2-budget-max-candidate-visits = 0

# Stage1 完成到持久修复的目标时间；0 禁用期限控制。
storage-owner-repair-deadline-ms = 0

# 计算侧读取维护水位的周期，单位毫秒。
storage-owner-flow-control-poll-ms = 5

# 反向更新队列容量。
storage-owner-reverse-queue-depth = 65536

# 一个反向更新批次的最大合并项数。
storage-owner-reverse-coalesce-max = 1

# 单目标允许的乐观反向更新冲突次数。
storage-owner-reverse-conflict-limit = 32

# 反向更新重试指数退避上限，单位微秒。
storage-owner-reverse-retry-backoff-max-us = 100000

[C2:transfer]
# 图访问组合：fixed、adaptive 或 manual。
gpu-dynamic-graph-access-mode = adaptive

# 图记录传输策略：fixed、header-neighbor 或 live-extent。
gpu-query-graph-read-policy = live-extent

# 是否根据动态 PQ 标记调整图读取长度。
gpu-dynamic-graph-extent = true

# 是否启用 sidecar 和动态标记的冷启动长度提示。
gpu-dynamic-graph-extent-hints = true

[C3:query]
# 权威图扩展提交宽度。
gpu-graph-commit-width = 16

# 图读取最大发起宽度；decoupled 时必须大于提交宽度。
gpu-graph-issue-width = 32

# 查询推进模式：coupled、decoupled 或 manual。
gpu-rdma-search-progression-mode = decoupled

# 是否在完整 Beam 发布前提前发起精确必需前沿。
gpu-exact-frontier-early-issue = true

# GPU Beam 合并实现：legacy 或 stable-run。
gpu-query-beam-merge-policy = stable-run

# 是否提前预取最终精确快照；当前 full 默认关闭。
gpu-terminal-exact-prefetch = false
